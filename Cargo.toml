# Cargo.toml

[workspace]
resolver = "2"
members = [
    "crates/bigwig",
    "crates/bigwig-io",
    "crates/galarp-run",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"


[workspace.dependencies]
bigwig = { path = "crates/bigwig" }
bigwig-io = { path = "crates/bigwig-io" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }

toml = "0.8"
hdf5 = { package = "hdf5-metno", version = "0.15" }
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

# Physics tests are slow unoptimized; keep debug assertions but optimize.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
